<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proiect SCC - Manchester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 4rem 2rem; border-radius: 0 0 2rem 2rem; }
        .card-custom { border: none; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="hero-section text-center">
        <h1 class="display-4 fw-bold">Ghidul Orașelor - Manchester</h1>
        <p class="lead">Proiect realizat în cadrul laboratorului de Sisteme de Conducere a Conexiunilor</p>
    </div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom p-4 mb-4">
                    <h3 class="text-primary border-bottom pb-2">Despre Manchester</h3>
                    <p class="fs-5 text-muted">{{ descriere }}</p>
                </div>
                
                <div class="card card-custom p-4">
                    <h3 class="text-success border-bottom pb-2">Date Demografice</h3>
                    <div class="d-flex align-items-center justify-content-between pt-2">
                        <span class="fs-5">Populație estimată:</span>
                        <span class="badge bg-success fs-5 p-2">{{ populatie }} locuitori</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
